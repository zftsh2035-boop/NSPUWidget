name: Android performance comparison
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - app/**
      - settings.gradle.kts
      - tools/widget-host/**
      - tools/verify_favorites.py
      - tools/verify_notes.py
      - tools/verify_widget_intro.py
      - tools/*performance*.py
      - tools/profile_android.py
      - tools/profile_android.sh
      - .github/workflows/performance.yml
concurrency:
  group: android-performance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Extract unchanged v2.9 sources
        run: |
          mkdir -p "$RUNNER_TEMP/nspu-baseline"
          git archive v2.9 | tar -x -C "$RUNNER_TEMP/nspu-baseline"
      - name: Assemble current and baseline APKs plus fixture seeder
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleFixture :widgethost:assembleDebug
          gradle --no-daemon -p "$RUNNER_TEMP/nspu-baseline" :app:assembleDebug
      - name: Allow KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare seeded scroll and verify room/teacher navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 tools/verify_widget_intro.py app/build/outputs/apk/fixture/app-fixture.apk app/build/outputs/apk/debug/app-debug.apk performance-results/widget-intro
            python3 tools/verify_notes.py app/build/outputs/apk/fixture/app-fixture.apk app/build/outputs/apk/debug/app-debug.apk tools/widget-host/build/outputs/apk/debug/*-debug.apk performance-results/notes
            python3 tools/verify_favorites.py app/build/outputs/apk/fixture/app-fixture.apk app/build/outputs/apk/debug/app-debug.apk tools/widget-host/build/outputs/apk/debug/*-debug.apk performance-results/favorites
            bash tools/profile_android.sh app/build/outputs/apk/fixture/app-fixture.apk "$RUNNER_TEMP/nspu-baseline/app/build/outputs/apk/debug/app-debug.apk" app/build/outputs/apk/debug/app-debug.apk performance-results
      - name: Summarize measured frames
        if: always()
        run: |
          mkdir -p performance-results
          python3 tools/summarize_performance.py performance-results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish frame logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android29-performance-comparison
          path: performance-results/
          if-no-files-found: warn
