name: Modern Android widget and planner checks
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - app/**
      - tools/verify_*.py
      - tools/profile_android.py
      - tools/widget-host/**
      - .github/workflows/modern-android.yml
concurrency:
  group: modern-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android35:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble optimized APK, fixture and disposable widget host
        run: gradle --no-daemon :app:assembleDebug :app:assembleFixture :widgethost:assembleDebug
      - name: Allow KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify responsive widgets, notes and reminders on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/verify_features.py app/build/outputs/apk/fixture/app-fixture.apk app/build/outputs/apk/debug/app-debug.apk tools/widget-host/build/outputs/apk/debug/*-debug.apk modern-results
      - name: Publish screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android35-feature-checks
          path: modern-results/
          if-no-files-found: warn
