name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, stable, dev]

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project source archive
        run: |
          if [ -f NSPUWidget-source.tar.xz ]; then
            tar --exclude='.github/workflows/build-apk.yml' -xJf NSPUWidget-source.tar.xz
            git restore .github/workflows/build-apk.yml
            rm NSPUWidget-source.tar.xz
          fi
      - name: Commit source files if newly unpacked
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete Android Kotlin source files'
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Android SDK 35 already installed"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Run schedule regression tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSPUWidget-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK in GitHub Releases
        if: github.ref == 'refs/heads/stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          TAG="v$VERSION"
          APK="NSPUWidget-${TAG}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "${APK}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "${APK}.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "${APK}.sha256" \
              --title "NSPUWidget $TAG" \
              --notes "Нативный Android-виджет расписания НГПУ. Это тестовая debug-сборка APK: выбор групп, цветные пары, объявления и фоновая проверка обновлений." \
              --target "$GITHUB_SHA" \
              --latest
          fi
