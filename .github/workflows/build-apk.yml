name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project sources
        run: |
          if [ -f NSPUWidget-source.tar.xz ]; then
            tar -xJf NSPUWidget-source.tar.xz
          fi
      - name: Publish unpacked source files to repository
        run: |
          if [ -f NSPUWidget-source.tar.xz ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Extract Kotlin Android project sources' || true
            git push || true
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSPUWidget-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
