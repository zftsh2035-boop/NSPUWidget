name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, stable, dev]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Prepare persistent release signing (optional GitHub Secrets)
        if: github.ref == 'refs/heads/stable'
        env:
          NSPU_KEYSTORE_B64: ${{ secrets.NSPU_KEYSTORE_B64 }}
          NSPU_KEYSTORE_PASSWORD: ${{ secrets.NSPU_KEYSTORE_PASSWORD }}
          NSPU_KEY_ALIAS: ${{ secrets.NSPU_KEY_ALIAS }}
          NSPU_KEY_PASSWORD: ${{ secrets.NSPU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$NSPU_KEYSTORE_B64" && -z "$NSPU_KEYSTORE_PASSWORD" && -z "$NSPU_KEY_ALIAS" && -z "$NSPU_KEY_PASSWORD" ]]; then
            echo "No persistent release signing key yet: keep optimized debug APK installable."
          elif [[ -n "$NSPU_KEYSTORE_B64" && -n "$NSPU_KEYSTORE_PASSWORD" && -n "$NSPU_KEY_ALIAS" && -n "$NSPU_KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$NSPU_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nspu-release.jks"
            echo "NSPU_SIGNING_KEYSTORE=$RUNNER_TEMP/nspu-release.jks" >> "$GITHUB_ENV"
            echo "Persistent signing key loaded from protected GitHub Secrets."
          else
            echo "::error::All four signing secrets must be configured together."
            exit 1
          fi
      - name: Run schedule regression tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Verify parser against the live public NSPU HTML (dev)
        if: github.ref == 'refs/heads/dev'
        env:
          NSPU_LIVE: 'true'
        run: gradle --no-daemon :app:testDebugUnitTest --tests ru.nspu.schedule.PublicTimetableLiveTest --rerun-tasks
      - name: Assemble R8 optimized APKs
        env:
          NSPU_KEYSTORE_PASSWORD: ${{ secrets.NSPU_KEYSTORE_PASSWORD }}
          NSPU_KEY_ALIAS: ${{ secrets.NSPU_KEY_ALIAS }}
          NSPU_KEY_PASSWORD: ${{ secrets.NSPU_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Check APK integrity and measure sizes
        run: |
          set -euo pipefail
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          test -s "$DEBUG"
          unzip -tq "$DEBUG" | tail -n 1
          DEBUG_SIZE=$(stat -c%s "$DEBUG")
          echo "Optimized debug APK: $DEBUG_SIZE bytes"
          echo "Previous v2.0 debug APK: 9437386 bytes"
          awk -v old=9437386 -v now="$DEBUG_SIZE" 'BEGIN {printf "Change: %.1f%%\n", 100 * (now - old) / old}'
          echo "### APK optimization" >> "$GITHUB_STEP_SUMMARY"
          echo "Optimized debug APK: $DEBUG_SIZE bytes (v2.0: 9437386 bytes)." >> "$GITHUB_STEP_SUMMARY"
          for apk in app/build/outputs/apk/release/*.apk; do
            if [[ -f "$apk" ]]; then
              unzip -tq "$apk" | tail -n 1
              echo "Release output: $apk ($(stat -c%s "$apk") bytes)"
            fi
          done
      - name: Upload optimized debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NSPUWidget-Android-optimized-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload optimized release variant for inspection
        uses: actions/upload-artifact@v4
        with:
          name: NSPUWidget-Android-optimized-release-output
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish stable APK to GitHub Releases
        if: github.ref == 'refs/heads/stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          TAG="v$VERSION"
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            SRC=app/build/outputs/apk/release/app-release.apk
            NAME="NSPUWidget-${TAG}-release.apk"
            NOTES="R8-optimized signed release. Built using a persistent signing key stored in GitHub Secrets."
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
            NAME="NSPUWidget-${TAG}-optimized-debug.apk"
            NOTES="R8-optimized debug-signed installable APK. A permanent release signing key is not yet configured; signatures may differ between builds."
          fi
          cp "$SRC" "$NAME"
          sha256sum "$NAME" > "${NAME}.sha256"
          FILE_BYTES=$(stat -c%s "$NAME")
          BASELINE=9437386
          DIFF=$(awk -v old="$BASELINE" -v now="$FILE_BYTES" 'BEGIN {printf "%.1f", 100*(now-old)/old}')
          NOTES_FILE="RELEASE_NOTES_${TAG}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            cat "$NOTES_FILE" > release-notes.md
          else
            printf '# NSPUWidget %s\n\n## Что изменилось\n\n- Исправления и улучшения стабильной версии.\n' "$TAG" > release-notes.md
          fi
          {
            printf '\n### Измеренные характеристики APK\n\n'
            printf -- '- **Файл:** `%s`\n' "$NAME"
            printf -- '- **Размер:** %s байт; сравнение с v2.0: %s%% (было %s байт).\n' "$FILE_BYTES" "$DIFF" "$BASELINE"
            printf -- '- **Тип:** %s\n' "$NOTES"
            printf -- '- **SHA-256:** см. приложенный файл `%s.sha256`.\n' "$NAME"
            printf -- '- **Выпуск:** commit `%s`, GitHub Actions.\n' "$GITHUB_SHA"
            printf '\n*Размер бинарника — прямой замер CI; память и батарея требуют отдельных замеров.*\n'
          } >> release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME" "${NAME}.sha256" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$NAME" "${NAME}.sha256" \
              --title "NSPUWidget $TAG" \
              --notes-file release-notes.md --target "$GITHUB_SHA" --latest
          fi
