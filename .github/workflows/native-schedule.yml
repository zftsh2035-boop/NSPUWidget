name: Native room and teacher regression checks
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - app/**
      - tools/verify_native.py
      - tools/verify_important.py
      - .github/workflows/native-schedule.yml
permissions:
  contents: read
concurrency:
  group: native-schedule-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test captured source HTML and assemble optimized APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleFixture
      - name: Allow KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the room and teacher screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 tools/verify_important.py app/build/outputs/apk/fixture/app-fixture.apk app/build/outputs/apk/debug/app-debug.apk important-results
            python3 tools/verify_native.py app/build/outputs/apk/fixture/app-fixture.apk app/build/outputs/apk/debug/app-debug.apk native-results
      - name: Publish source test results, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-schedule-Android${{ matrix.api }}
          path: |
            native-results/
            important-results/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
